# Shows on every pull request what Terraform would change in staging. It only
# plans (read-only role, no state lock) and never applies.
name: pr-plan

on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/actions/terraform-plan/**"
      - ".github/workflows/pr-plan.yml"

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: plan (staging)
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: staging-pr-plan
    concurrency:
      group: terraform-staging-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      summary: ${{ steps.plan.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      # TEMPORARY: prints the OIDC claims AWS checks against the role trust policy. Remove once fixed.
      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const claims = JSON.parse(Buffer.from(token.split(".")[1], "base64url").toString());
            core.info(`sub: ${claims.sub}`);
            core.info(`aud: ${claims.aud}`);
            core.info(`environment: ${claims.environment}`);

      # TEMPORARY: shows which role the AWS_ROLE_ARN secret points to (role name and account check only)
      - name: Debug role ARN
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          echo "role name: ${ROLE_ARN##*/}"
          echo "starts with arn:aws:iam::007036861277:role/ -> $([[ "$ROLE_ARN" == arn:aws:iam::007036861277:role/* ]] && echo yes || echo NO)"
          echo "length: ${#ROLE_ARN} (spaces/newlines inside: $([[ "$ROLE_ARN" =~ [[:space:]] ]] && echo YES || echo no))"

      - name: Plan
        id: plan
        uses: ./.github/actions/terraform-plan
        with:
          environment: staging
          vars: ${{ toJSON(vars) }}
          aws-role-arn: arn:aws:iam::007036861277:role/app-kaapi-staging-github-pr-plan
          aws-region: ap-south-1
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          vpc-id: ${{ secrets.VPC_ID }}
          ecs-subnet-ids: ${{ secrets.ECS_SUBNET_IDS }}
          ecs-security-group-ids: ${{ secrets.ECS_SECURITY_GROUP_IDS }}
          lock: "false"
          summary-note: Plan for this pull request only. Nothing is applied until it is merged and approved.

  comment:
    needs: plan
    if: always() && needs.plan.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post plan to the pull request
        uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.plan.result }}
          SUMMARY: ${{ needs.plan.outputs.summary }}
        with:
          script: |
            const marker = "<!-- terraform-plan:staging -->";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = process.env.RESULT === "success"
              ? `${marker}\n### Terraform plan: staging\n${process.env.SUMMARY}\n\nFull plan: [workflow run](${runUrl}). Nothing is applied from pull requests.`
              : `${marker}\n### Terraform plan: staging ❌\nThe plan failed. See the [workflow run](${runUrl}).`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
