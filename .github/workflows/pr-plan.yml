name: pr-plan

on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/pr-plan.yml"
      - ".github/workflows/plan-and-apply.yml"

permissions:
  contents: read
  id-token: write

jobs:
  staging:
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/plan-and-apply.yml
    with:
      environment: staging
      pull_request: true

  comment:
    needs: staging
    if: always() && needs.staging.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post plan to the pull request
        uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.staging.result }}
          SUMMARY: ${{ needs.staging.outputs.summary }}
        with:
          script: |
            const marker = "<!-- terraform-plan:staging -->";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = process.env.RESULT === "success"
              ? `${marker}\n### Terraform plan: staging\n${process.env.SUMMARY}\n\nFull plan: [workflow run](${runUrl}). Nothing is applied from pull requests.`
              : `${marker}\n### Terraform plan: staging ❌\nThe plan failed. See the [workflow run](${runUrl}).`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
