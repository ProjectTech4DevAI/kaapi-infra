# Plan and apply one environment, each behind its own GitHub environment:
#   <env>-plan  : reviewers approve creating the plan
#   <env>-apply : reviewers read the plan in the run summary, then approve applying it
name: plan-and-apply

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_DIR: environments/${{ inputs.environment }}
  PLAN_KEY: plans/${{ inputs.environment }}/${{ github.run_id }}.tfplan

jobs:
  plan:
    name: plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-plan
    concurrency:
      group: terraform-${{ inputs.environment }}-plan
      cancel-in-progress: true
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - name: Plan
        id: plan
        uses: ./.github/actions/terraform-plan
        with:
          environment: ${{ inputs.environment }}
          vars: ${{ toJSON(vars) }}
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          aws-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          vpc-id: ${{ secrets.VPC_ID }}
          ecs-subnet-ids: ${{ secrets.ECS_SUBNET_IDS }}
          ecs-security-group-ids: ${{ secrets.ECS_SECURITY_GROUP_IDS }}
          summary-note: Review this plan, then approve the **${{ inputs.environment }}-apply** deployment to apply it.

      - name: Save plan
        if: steps.plan.outputs.has_changes == 'true'
        run: aws s3 cp "$TF_DIR/tfplan" "s3://${{ vars.TF_STATE_BUCKET }}/$PLAN_KEY"

  apply:
    name: apply (${{ inputs.environment }})
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-apply
    concurrency:
      group: terraform-${{ inputs.environment }}-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: Init
        run: >-
          terraform -chdir="$TF_DIR" init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ secrets.AWS_REGION }}"

      # Applies exactly the reviewed plan; Terraform refuses it if state changed since
      - name: Apply
        run: |
          aws s3 cp "s3://${{ vars.TF_STATE_BUCKET }}/$PLAN_KEY" "$TF_DIR/tfplan"
          terraform -chdir="$TF_DIR" apply -lock-timeout=5m tfplan

      - name: Delete saved plan
        if: always()
        run: aws s3 rm "s3://${{ vars.TF_STATE_BUCKET }}/$PLAN_KEY" || true
