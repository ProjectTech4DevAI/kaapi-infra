# Plan and apply one environment, each behind its own GitHub environment:
#   <env>-plan  : reviewers approve creating the plan
#   <env>-apply : reviewers read the plan in the run summary, then approve applying it
name: plan-and-apply

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_DIR: environments/${{ inputs.environment }}
  PLAN_KEY: plans/${{ inputs.environment }}/${{ github.run_id }}.tfplan

jobs:
  plan:
    name: plan (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-plan
    concurrency:
      group: terraform-${{ inputs.environment }}-plan
      cancel-in-progress: true
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Init
        run: >-
          terraform -chdir="$TF_DIR" init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Plan
        id: plan
        env:
          TF_VAR_aws_region: ${{ vars.AWS_REGION }}
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_monitoring_alert_emails: ${{ secrets.MONITORING_ALERT_EMAILS || '[]' }}
          TF_VAR_ecs_private_environment: ${{ secrets.ECS_PRIVATE_ENVIRONMENT || '{}' }}
          TF_VAR_vpc_id: ${{ secrets.VPC_ID }}
          TF_VAR_ecs_subnet_ids: ${{ secrets.ECS_SUBNET_IDS }}
          TF_VAR_ecs_security_group_ids: ${{ secrets.ECS_SECURITY_GROUP_IDS }}
          TF_VAR_monitoring_ec2_instances: ${{ secrets.MONITORING_EC2_INSTANCES || '{}' }}
        run: |
          set +e
          terraform -chdir="$TF_DIR" plan -var-file=constants.tfvars -out=tfplan -detailed-exitcode -lock-timeout=5m
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -eq 2 ]; then echo "has_changes=true"; else echo "has_changes=false"; fi >> "$GITHUB_OUTPUT"

      - name: Plan summary
        run: |
          terraform -chdir="$TF_DIR" show -no-color tfplan > plan.txt
          {
            echo "## Terraform plan: ${{ inputs.environment }}"
            if [ "${{ steps.plan.outputs.has_changes }}" = "true" ]; then
              echo "Review this plan, then approve the **${{ inputs.environment }}-apply** deployment to apply it."
            else
              echo "No changes. Nothing to apply."
            fi
            echo '```'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save plan
        if: steps.plan.outputs.has_changes == 'true'
        run: aws s3 cp "$TF_DIR/tfplan" "s3://${{ vars.TF_STATE_BUCKET }}/$PLAN_KEY"

  apply:
    name: apply (${{ inputs.environment }})
    needs: plan
    if: needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-apply
    concurrency:
      group: terraform-${{ inputs.environment }}-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Init
        run: >-
          terraform -chdir="$TF_DIR" init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="region=${{ vars.AWS_REGION }}"

      # Applies exactly the reviewed plan; Terraform refuses it if state changed since
      - name: Apply
        run: |
          aws s3 cp "s3://${{ vars.TF_STATE_BUCKET }}/$PLAN_KEY" "$TF_DIR/tfplan"
          terraform -chdir="$TF_DIR" apply -lock-timeout=5m tfplan

      - name: Delete saved plan
        if: always()
        run: aws s3 rm "s3://${{ vars.TF_STATE_BUCKET }}/$PLAN_KEY" || true
