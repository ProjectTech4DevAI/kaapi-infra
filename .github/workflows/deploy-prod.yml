name: deploy-prod

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write

jobs:
  # Rejects tags that point outside main before anyone is asked to approve
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${{ github.ref_name }} does not point to a commit on main."
            exit 1
          fi

  prod:
    needs: check-tag
    uses: ./.github/workflows/plan-and-apply.yml
    with:
      environment: prod
