name: pr-checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: No REPLACE_ME left
        run: |
          if grep -n "REPLACE_ME" environments/${{ matrix.environment }}/constants.tfvars; then
            echo "::error::environments/${{ matrix.environment }}/constants.tfvars still has REPLACE_ME values"
            exit 1
          fi

      - name: Validate
        run: |
          terraform -chdir=environments/${{ matrix.environment }} init -backend=false
          terraform -chdir=environments/${{ matrix.environment }} validate
